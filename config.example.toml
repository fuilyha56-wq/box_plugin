# Box Plugin 配置示例（复制为 config.toml 后修改）

[plugin]
enabled = true
version = "2.0.0"

[basic]
# 是否仅 Bot 管理员可开盒他人（开盒自己不受限制）
only_admin = false
# 插件卸载/重载时是否清空缓存的开盒卡片
clean_cache = false

[groups]
# 自动开盒群聊白名单。留空表示所有群启用入群/退群自动开盒
auto_box_groups = []

[protection]
# 信息保护用户名单。Bot 自身会自动加入保护名单
protect_ids = []

[display]
qq_number = true
nickname = true
remark = true
group_nickname = true
group_title = true
gender = true
birthday = true
constellation = true
zodiac = true
age = true
blood_type = true
phone = false
email = false
hometown = true
address = true
career = true
tags = true
risky_account = true
robot_account = true
qq_vip = true
year_vip = true
vip_level = true
group_level = true
join_time = true
qq_level = true
reg_time = true
signature = true

[recall]
# 开盒卡片发送后多少秒撤回，0 表示不撤回
# 当前版本撤回功能为日志占位，等待 neo-mofox 提供统一撤回 API
recall_time = 0

[adapter]
# 用于查询 QQ 用户信息的 Adapter 组件签名
adapter_signature = "napcat_adapter:adapter:napcat_adapter"
# 调用适配器 API 的超时秒数
api_timeout = 20.0

[font]
# 首次运行时自动下载到 plugin_dir/data/fonts/，避免插件包体积过大
cute_font_url = "https://cdn.jsdelivr.net/gh/Zhalslar/astrbot_plugin_box@master/font/%E5%8F%AF%E7%88%B1%E5%AD%97%E4%BD%93.ttf"
emoji_font_url = "https://cdn.jsdelivr.net/gh/googlefonts/noto-emoji@main/fonts/NotoColorEmoji.ttf"
download_timeout = 30.0
# 是否跳过 Emoji 字体下载（启用后所有字符都用中文字体绘制）
skip_emoji_font = false
